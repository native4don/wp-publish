[project]
name = "wp-publish"
version = "0.1.0"
description = "Publish Markdown pages to a WordPress site through its REST API"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["requests", "pyyaml", "markdown-it-py"]

[project.optional-dependencies]
test = ["pytest", "responses"]

[project.scripts]
wp-publish = "wp_publish.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
